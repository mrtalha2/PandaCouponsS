name: Monthly Rebuild
on:
  schedule:
    - cron: '5 8 1 * *'
  workflow_dispatch:

jobs:
  rebuild:
    name: Monthly Rebuild & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build
        run: rm -rf dist && node build.js

      - name: Run verification test suite
        run: npm test
